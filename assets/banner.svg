<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Chart Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Filter for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      .metric-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        fill: #64748b;
        font-weight: 500;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #f8fafc;
      }

      /* Animated Elements */
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
        50% { transform: scale(1.15) translate(-20px, 15px); opacity: 1; }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes dashAnim {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shimmer {
        0% { opacity: 0.4; }
        50% { opacity: 0.9; }
        100% { opacity: 0.4; }
      }

      .animated-orb-1 {
        animation: pulseOrb 10s ease-in-out infinite;
        transform-origin: 300px 150px;
      }
      .animated-orb-2 {
        animation: pulseOrb 12s ease-in-out infinite reverse;
        transform-origin: 900px 250px;
      }
      .floating-card-1 {
        animation: floatCard1 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatCard2 7s ease-in-out infinite;
      }
      .chart-line {
        stroke-dasharray: 600;
        animation: dashAnim 4s ease-out forwards;
      }
      .live-dot {
        animation: shimmer 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- 1. Background layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- 2. Animated background glow orbs -->
  <circle class="animated-orb-1" cx="240" cy="120" r="280" fill="url(#orb1)" />
  <circle class="animated-orb-2" cx="960" cy="280" r="320" fill="url(#orb2)" />

  <!-- 3. Tech grid overlay -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- 4. Subtle background chart graphic (Right side background behind cards) -->
  <g opacity="0.35" transform="translate(620, 160)">
    <path d="M 0 160 Q 90 140, 150 90 T 300 70 T 450 20 T 540 5" fill="none" stroke="url(#lineGrad)" stroke-width="3" class="chart-line" />
    <path d="M 0 160 Q 90 140, 150 90 T 300 70 T 450 20 T 540 5 L 540 200 L 0 200 Z" fill="url(#areaGrad)" />
  </g>

  <!-- 5. Dynamic / Interactive Analytics Visual Cards (Placed right side, strictly in background of text) -->
  <g class="floating-card-1" transform="translate(860, 55)">
    <rect width="280" height="135" rx="12" fill="#131c2e" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="6" fill="#10b981" class="live-dot" />
    <text x="42" y="32" class="metric-label">MRR GROWTH RATE</text>
    <text x="28" y="70" class="metric-val" font-size="24">+28.4%</text>
    <path d="M 28 108 C 60 100, 90 115, 130 92 C 170 70, 210 85, 252 58" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <text x="210" y="32" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="700">MoM ↑</text>
  </g>

  <g class="floating-card-2" transform="translate(820, 220)">
    <rect width="320" height="145" rx="12" fill="#131c2e" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <text x="25" y="32" class="metric-label">COHORT RETENTION (BENCHMARK)</text>
    <g transform="translate(25, 52)">
      <!-- Mini cohort cells -->
      <rect x="0" y="0" width="45" height="22" rx="4" fill="#38bdf8" fill-opacity="0.9" />
      <text x="10" y="16" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="bold">100%</text>
      <rect x="52" y="0" width="45" height="22" rx="4" fill="#38bdf8" fill-opacity="0.75" />
      <text x="64" y="16" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="bold">92%</text>
      <rect x="104" y="0" width="45" height="22" rx="4" fill="#38bdf8" fill-opacity="0.6" />
      <text x="116" y="16" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="bold">88%</text>
      <rect x="156" y="0" width="45" height="22" rx="4" fill="#38bdf8" fill-opacity="0.45" />
      <text x="168" y="16" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold">84%</text>
      <rect x="208" y="0" width="45" height="22" rx="4" fill="#818cf8" fill-opacity="0.4" />
      <text x="220" y="16" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold">81%</text>

      <rect x="0" y="28" width="45" height="22" rx="4" fill="#38bdf8" fill-opacity="0.9" />
      <text x="10" y="44" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="bold">100%</text>
      <rect x="52" y="28" width="45" height="22" rx="4" fill="#38bdf8" fill-opacity="0.8" />
      <text x="64" y="44" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="bold">94%</text>
      <rect x="104" y="28" width="45" height="22" rx="4" fill="#38bdf8" fill-opacity="0.65" />
      <text x="116" y="44" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="bold">89%</text>
      <rect x="156" y="28" width="45" height="22" rx="4" fill="#818cf8" fill-opacity="0.4" />
      <text x="168" y="44" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold">85%</text>
    </g>
    <text x="25" y="125" class="metric-label">Benchmark: Top Quartile B2B SaaS</text>
  </g>

  <!-- 6. FOREGROUND CONTENT: Header, Title, Subtitle, Badges (Left 750px safe zone) -->
  <g transform="translate(70, 75)">
    <!-- Pill Category Header -->
    <g transform="translate(0, 0)">
      <rect width="215" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="15" cy="15" r="4.5" fill="#38bdf8" class="live-dot" />
      <text x="28" y="20" class="tag-text" fill="#38bdf8">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title (Guaranteed foreground, clear contrast) -->
    <text x="0" y="75" class="title-text" fill="#ffffff">
      Awesome Free SaaS
    </text>
    <text x="0" y="125" class="title-text" fill="url(#primaryGrad)">
      Financial Metrics &amp; Benchmarking
    </text>

    <!-- Subtitle (Informative, SEO-rich) -->
    <text x="0" y="172" class="subtitle-text">
      Curated MRR/ARR analytics, churn tracking, LTV calculators,
    </text>
    <text x="0" y="200" class="subtitle-text">
      and self-hosted open-source subscription intelligence for founders.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: MRR & Churn -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="21" class="tag-text" fill="#cbd5e1">📊 MRR &amp; Churn</text>

      <!-- Pill 2: Open Source -->
      <rect x="142" y="0" width="135" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="156" y="21" class="tag-text" fill="#cbd5e1">💻 Open Source</text>

      <!-- Pill 3: Self-Hosted -->
      <rect x="289" y="0" width="125" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="303" y="21" class="tag-text" fill="#cbd5e1">🔒 Self-Hosted</text>

      <!-- Pill 4: Zero Fees -->
      <rect x="426" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="440" y="21" class="tag-text" fill="#34d399">✨ 100% Free Tiers</text>
    </g>
  </g>
</svg>